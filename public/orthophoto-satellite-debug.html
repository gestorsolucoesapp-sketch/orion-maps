<!doctype html><meta charset="utf-8"><title>Satellite test</title><canvas id="c"></canvas><pre id="l"></pre><script>(async()=>{try{const u='https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/export?bbox=-46.851675,-21.597494,-46.848494,-21.594803&bboxSR=4326&imageSR=4326&size=2600,2165&format=jpg&compressionQuality=92&f=image';const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const b=await r.blob();const im=await createImageBitmap(b);const c=document.getElementById('c');c.width=im.width;c.height=im.height;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(im,0,0);const p=x.getImageData(0,0,1,1).data;document.getElementById('l').textContent=JSON.stringify({type:b.type,size:b.size,width:im.width,height:im.height,pixel:[...p]});document.title='SATOK '+im.width+'x'+im.height;}catch(e){document.getElementById('l').textContent=String(e&&e.stack||e);document.title='ERR '+String(e&&e.message||e).slice(0,120)}})();</script>
