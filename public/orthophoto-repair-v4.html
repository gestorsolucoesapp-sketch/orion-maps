<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orion Maps — acabamento final</title>
<style>
body{font-family:Arial,sans-serif;background:#eaf1e7;color:#173d2a;padding:24px}
.card{max-width:980px;margin:auto;background:#fff;padding:24px;border-radius:20px;box-shadow:0 12px 35px #173d2a22}
canvas{max-width:100%;margin-top:16px;border-radius:12px;background:#eee}
pre{white-space:pre-wrap;background:#f3f7f1;padding:12px;border-radius:10px}
</style>
</head>
<body><div class="card">
<h1>Orion Maps — preenchendo somente as falhas transparentes</h1>
<p id="s">Iniciando…</p>
<canvas id="c"></canvas>
<pre id="l"></pre>
</div>
<script>
const E='https://zxmhpkcxwlpvkelqapbf.supabase.co/functions/v1/orion-preview-repair';
const T=new URLSearchParams(location.search).get('token')||'';
const B={west:-46.851675,south:-21.597494,east:-46.848494,north:-21.594803};
const s=document.getElementById('s'),l=document.getElementById('l'),c=document.getElementById('c');
function tileXY(lon,lat,z){const n=2**z,r=lat*Math.PI/180;return[(lon+180)/360*n,(1-Math.asinh(Math.tan(r))/Math.PI)/2*n]}
function median(values){if(!values.length)return NaN;values.sort((a,b)=>a-b);return values[values.length>>1]}
(async()=>{try{
  if(!T)throw new Error('Token ausente');
  s.textContent='Baixando a prévia transparente atual…';
  const r=await fetch(E+'?action=source-clean&token='+encodeURIComponent(T),{cache:'no-store'});
  if(!r.ok)throw new Error('Download: '+await r.text());
  const bmp=await createImageBitmap(await r.blob());
  const maxSide=2600,scale=Math.min(1,maxSide/Math.max(bmp.width,bmp.height));
  const w=Math.max(1,Math.round(bmp.width*scale)),h=Math.max(1,Math.round(bmp.height*scale));
  c.width=w;c.height=h;
  const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(bmp,0,0,w,h);
  const img=ctx.getImageData(0,0,w,h),d=img.data,n=w*h;

  s.textContent='Montando a imagem de apoio alinhada…';
  const z=19,[xw,yn]=tileXY(B.west,B.north,z),[xe,ys]=tileXY(B.east,B.south,z);
  const satCanvas=document.createElement('canvas');satCanvas.width=w;satCanvas.height=h;
  const satCtx=satCanvas.getContext('2d',{willReadFrequently:true});satCtx.imageSmoothingEnabled=true;satCtx.imageSmoothingQuality='high';
  const tiles=[];
  for(let ty=Math.floor(yn);ty<=Math.floor(ys);ty++)for(let tx=Math.floor(xw);tx<=Math.floor(xe);tx++)tiles.push({tx,ty});
  let loaded=0;
  await Promise.all(tiles.map(async({tx,ty})=>{
    const u='https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/'+z+'/'+ty+'/'+tx;
    const tr=await fetch(u,{cache:'force-cache'});if(!tr.ok)throw new Error('Tile '+tr.status);
    const ti=await createImageBitmap(await tr.blob());
    const dx=(tx-xw)/(xe-xw)*w,dy=(ty-yn)/(ys-yn)*h,dw=w/(xe-xw),dh=h/(ys-yn);
    satCtx.drawImage(ti,Math.floor(dx)-1,Math.floor(dy)-1,Math.ceil(dw)+2,Math.ceil(dh)+2);
    loaded++;s.textContent='Montando a imagem de apoio alinhada… '+loaded+'/'+tiles.length;
  }));
  const sat=satCtx.getImageData(0,0,w,h).data;

  s.textContent='Calculando o contorno limpo da ortofoto…';
  const rawL=new Int32Array(h),rawR=new Int32Array(h);rawL.fill(-1);rawR.fill(-1);
  let originalPixels=0;
  for(let y=0;y<h;y++){
    let first=-1,last=-1,count=0;
    for(let x=0;x<w;x++){
      const a=d[(y*w+x)*4+3];
      if(a>32){if(first<0)first=x;last=x;count++;originalPixels++}
    }
    if(first>=0&&last-first>Math.max(18,w*.025)&&count>Math.max(15,w*.012)){rawL[y]=first;rawR[y]=last}
  }
  let firstY=-1,lastY=-1;
  for(let y=0;y<h;y++)if(rawL[y]>=0){if(firstY<0)firstY=y;lastY=y}
  if(firstY<0)throw new Error('Contorno não encontrado');

  const medL=new Float64Array(h),medR=new Float64Array(h);medL.fill(NaN);medR.fill(NaN);
  const radius=14;
  for(let y=firstY;y<=lastY;y++){
    const ls=[],rs=[];
    for(let yy=Math.max(firstY,y-radius);yy<=Math.min(lastY,y+radius);yy++)if(rawL[yy]>=0){ls.push(rawL[yy]);rs.push(rawR[yy])}
    if(ls.length>=3){medL[y]=median(ls);medR[y]=median(rs)}
  }
  const left=new Float64Array(h),right=new Float64Array(h);left.fill(NaN);right.fill(NaN);
  const avgRadius=9;
  for(let y=firstY;y<=lastY;y++){
    let sl=0,sr=0,cnt=0;
    for(let yy=Math.max(firstY,y-avgRadius);yy<=Math.min(lastY,y+avgRadius);yy++)if(Number.isFinite(medL[yy])){sl+=medL[yy];sr+=medR[yy];cnt++}
    if(cnt){left[y]=sl/cnt-2;right[y]=sr/cnt+2}
  }

  let footprintPixels=0,filledPixels=0,featherPixels=0;
  const out=new Uint8ClampedArray(d.length);
  for(let y=0;y<h;y++){
    if(!Number.isFinite(left[y]))continue;
    const lx=Math.max(0,Math.floor(left[y])),rx=Math.min(w-1,Math.ceil(right[y]));
    for(let x=lx;x<=rx;x++){
      const p=y*w+x,i=p*4,a=d[i+3]/255;footprintPixels++;
      const edgeDist=Math.min(x-lx,rx-x,y-firstY,lastY-y);
      const edgeAlpha=Math.max(0,Math.min(1,edgeDist/4));
      const originalWeight=Math.max(a,0);
      out[i]=Math.round(sat[i]*(1-originalWeight)+d[i]*originalWeight);
      out[i+1]=Math.round(sat[i+1]*(1-originalWeight)+d[i+1]*originalWeight);
      out[i+2]=Math.round(sat[i+2]*(1-originalWeight)+d[i+2]*originalWeight);
      out[i+3]=Math.round(255*edgeAlpha);
      if(a<.20)filledPixels++;else if(a<.98)featherPixels++;
    }
  }

  // Preserve narrow protrusions that belong to the original image while keeping their native alpha.
  for(let p=0;p<n;p++){
    const i=p*4,a=d[i+3];if(a<=32||out[i+3]>0)continue;
    out[i]=d[i];out[i+1]=d[i+1];out[i+2]=d[i+2];out[i+3]=a;
  }

  const result=new ImageData(out,w,h);ctx.putImageData(result,0,0);
  const footprintRatio=footprintPixels/n,fillRatio=filledPixels/Math.max(1,footprintPixels);
  if(footprintRatio<.12||footprintRatio>.75)throw new Error('Contorno inseguro: '+(footprintRatio*100).toFixed(2)+'%');
  if(fillRatio>.40)throw new Error('Preenchimento excessivo: '+(fillRatio*100).toFixed(2)+'%');
  const blob=await new Promise((ok,no)=>c.toBlob(b=>b?ok(b):no(new Error('PNG')),'image/png'));
  if(blob.size<1000000||blob.size>25000000)throw new Error('Tamanho inseguro: '+blob.size);
  l.textContent=JSON.stringify({width:w,height:h,tiles:tiles.length,footprint_percent:(footprintRatio*100).toFixed(2),filled_transparent_pixels:filledPixels,filled_percent_of_footprint:(fillRatio*100).toFixed(2),feather_pixels:featherPixels,size_MB:(blob.size/1048576).toFixed(2)},null,2);
  s.textContent='Enviando a prévia final…';
  const up=await fetch(E+'?action=upload&token='+encodeURIComponent(T),{method:'POST',headers:{'content-type':'image/png','x-repair-token':T},body:blob});
  const tx=await up.text();if(!up.ok)throw new Error('Upload: '+tx);
  l.textContent+='\n\n'+tx;s.textContent='Concluído — detalhes brancos preenchidos e mapa padrão preservado.';document.title='DONE V4 — Orion Maps';
}catch(e){s.textContent='Falha';l.textContent=String(e&&e.stack||e);document.title='ERR V4 '+String(e&&e.message||e).slice(0,100)}})();
</script></body></html>
